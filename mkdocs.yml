site_name: FLEET Webservice Kundenportal
site_url: https://harzmann.github.io/fleet_webservice_doc/
repo_url: https://github.com/harzmann/fleet_webservice_doc
theme:
  name: material
  language: de
  font: false
  palette:
    scheme: default
    primary: blue
    accent: blue
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
nav:
  - Start: index.md
  - Webservice-Funktionen: functions.md
  - Installation: installation.md
  - Update: update.md
  - Downloads: download.md
  - Änderungen: changelog.md
copyright: Copyright eh-systemhaus 2026
markdown_extensions:
  - admonition
  - toc:
      permalink: true

extra_css:
  - stylesheets/fleet-mira-theme.css
  - stylesheets/image-lightbox.css

extra_javascript:
  - javascripts/image-lightbox.js
